name: Update radar

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch, aggregate, render
        run: python3 main.py --all

      - name: Commit snapshot and dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ data/history/
          if git diff --staged --quiet; then
            echo "No dashboard/snapshot changes"
          else
            git commit -m "chore: daily skill-demand snapshot"
            git push
          fi
